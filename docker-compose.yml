version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_cyber
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123 # Đặt mật khẩu có chữ hoa, thường, số, ký tự đặc biệt
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql/data

volumes:
  sql_data:
